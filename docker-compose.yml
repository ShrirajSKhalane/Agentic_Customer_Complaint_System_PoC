name: agentic-complaint-poc

x-app-base: &app-base
  build:
    context: .
  restart: unless-stopped
  environment: &app-environment
    DATABASE_URL: postgresql://complaints:complaints@postgres:5432/complaints
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    MCP_URL: http://mcp-server:8003/mcp
    POLICY_AGENT_URL: http://policy-agent:8001
    INVESTIGATION_AGENT_URL: http://investigation-agent:8002
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    LLM_STUB: ${LLM_STUB:-0}
    # Default LLM_STUB=0: triage, investigation plan, and policy call gpt-4o-mini.
    # Set LLM_STUB=1 for fixtures (seeded classify, plan, and policy assess).
    # Duplicate math and refund gates stay in code either way.
    AUTO_REFUND_LIMIT_INR: ${AUTO_REFUND_LIMIT_INR:-10000}
  depends_on:
    kafka:
      condition: service_healthy
    postgres:
      condition: service_healthy

services:
  kafka:
    image: apache/kafka:4.1.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30

  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: complaints
      POSTGRES_USER: complaints
      POSTGRES_PASSWORD: complaints
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U complaints -d complaints"]
      interval: 3s
      timeout: 3s
      retries: 30

  complaint-api:
    <<: *app-base
    command: ["python", "-m", "poc.complaint_api"]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 30

  triage-agent:
    <<: *app-base
    command: ["python", "-m", "poc.triage_agent"]

  investigation-agent:
    <<: *app-base
    command: ["python", "-m", "poc.investigation_agent"]
    # Inherits OPENAI_API_KEY and LLM_STUB from x-app-base. Default LLM_STUB=0
    # calls gpt-4o-mini for the investigation plan; LLM_STUB=1 uses fixtures.
    ports:
      - "8002:8002"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mcp-server:
        condition: service_healthy
      policy-agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 5s
      timeout: 3s
      retries: 30

  policy-agent:
    <<: *app-base
    command: ["python", "-m", "poc.policy_agent"]
    ports:
      - "8001:8001"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mcp-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 5s
      timeout: 3s
      retries: 30

  resolution-agent:
    <<: *app-base
    command: ["python", "-m", "poc.resolution_agent"]
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mcp-server:
        condition: service_healthy

  notification-service:
    <<: *app-base
    command: ["python", "-m", "poc.notification_service"]

  mcp-server:
    <<: *app-base
    command: ["python", "-m", "poc.mcp_server"]
    ports:
      - "8003:8003"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
