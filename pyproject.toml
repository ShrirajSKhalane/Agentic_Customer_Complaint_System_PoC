[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-complaint-poc"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.20,<1",
  "pydantic>=2.11,<3",
  "psycopg[binary,pool]>=3.2,<4",
  "confluent-kafka>=2.11,<3",
  "openai>=1.99,<3",
  "mcp==2.1.1",
  "a2a-sdk[fastapi]==1.1.2",
  "langgraph==1.2.11",
  "langgraph-checkpoint-postgres==3.1.2",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.4,<10", "pytest-asyncio>=1.1,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
addopts = "--import-mode=prepend"

[tool.setuptools.packages.find]
include = ["poc*"]
